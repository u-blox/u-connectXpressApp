# 192 KB RAM (plus 64 KB CCM that DMA cannot reach); the arena leaves room for the trigger.* thread's 12 KB stack.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=63488

# CAN controller for can.* (zephyr,canbus, pins in the overlay).
CONFIG_CAN=y
# hw.* on the board's pins (user button and LED)
CONFIG_GPIO=y
