[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["u-connectClient", "u-connectXpress", "sps", "ucx-xmodem", "third-party", "build", ".venv",
                  "matter/connectedhomeip"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# One line per test with [ NN%] progress; short tracebacks; summary of failures only (not the skips).
addopts = "-v --tb=short -rfE"
# A test still running after 10 minutes is hung: dump every thread's stack so the hang shows where it is.
faulthandler_timeout = 600

[tool.coverage.run]
source = ["tests"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

