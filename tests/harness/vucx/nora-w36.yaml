# vucx profile: a NORA-W36 that says OK to everything it does not know, with Wi-Fi, a BLE peer,
# a heart rate service and ANCS on the peer, a GATT server, an MQTT broker with one message waiting
# and a hotel login page in front of the internet, Thingstream/AssistNow and Wi-Fi location services behind it.
# Used to drive whole command groups and the use cases.
include: [wifi.yaml]
default: ["OK"]
# our own GATT server hands out handles like the module (service 40, characteristics 42/43, 45/46 ...; the next
# service 60); URCs name a characteristic of the services being activated as {h:<uuid prefix>}, its CCCD as {c:...}
gatt_server: true
state:
  'AT+UHTCRP=0,"/generate_204"': {page: probe}
  'AT+UHTCRP=0,"/login*"': {page: login}
  'AT+UHTCRP=0,"/ztp/assistnow/*"': {page: ztp}
  'AT+UHTCRP=0,"/GetAssistNowData*"': {page: assistnow}
  # wifi.locate: Google, Skyhook, HERE and Combain
  'AT+UHTCRP=0,"/geolocation/v1/geolocate?key=*"': {page: locate}
  'AT+UHTCRP=0,"/wps2/json/location?key=*"': {page: locate}
  'AT+UHTCRP=0,"/v2/locate?apiKey=*"': {page: locate}
  'AT+UHTCRP=0,"/?key=*"': {page: locate}
  "AT+UHTCRP=*": {page: other}
  "AT+UHTCRPOB=* [page=ztp]": {page: ztp}
  "AT+UHTCRPOB=* [page=locate]": {page: locate}
  "AT+UHTCRPOB=*": {page: posted, portal: open}
  # BLE: the link to the peer, and numeric comparison once (bt.defaults secure sets Display Yes/No)
  "AT+UBTC=*": {link: up}
  "AT+UBTDC=*": {link: down}
  "AT+UBTIOC=2": {iocap: yesno}
  "AT+UBTIOC=*": {iocap: other}
  "AT+UBTUC=*": {iocap: confirmed}
  # Channel Sounding: a reflector in range once bt.cs initiator has set the role
  "AT+UBTCSM=2": {cs: initiator}
  "AT+UBTCSM=*": {cs: other}
  "AT+UBTCSKF=*,*,0": {kf: "off"}
  "AT+UBTCSKF=*": {kf: "on"}
commands:
  "AT+UBTCSKF? [kf=off]": ["+UBTCSKF:1,500,0", "OK"]
  "AT+UBTCSKF?": ["+UBTCSKF:1,500,1", "OK"]
  "AT+UBTCSRT?": ["+UBTCSRT:10", "OK"]
  "AT+UBTCSREF?": ["+UBTCSREF:0", "OK"]
  "AT+UBTCSIQ?": ["+UBTCSIQ:0", "OK"]
  "AT+UBTDFD=9": ["+UBTDFD:9,0,", "OK"]
  "AT+UBTDFD?": ["+UBTDFD:0,9,4E4F5241", "+UBTDFD:3,255,0102FF", "OK"]
  "AT+UBTDFD*": ["OK"]
  "AT+UBTD*":
    - '+UBTD:C0FFEE001122p,-50,"vucx-hrs",0,020106030D18'
    - '+UBTD:C0FFEE001155p,-58,"NORA-W36",0,02010609094E4F52412D573336'
    - '+UBTD:C0FFEE001166r,-64,"reflector",0,020106'
    - '+UBTD:C0FFEE001133r,-70,"",0,020106'
    - "OK"
  "AT+UBTCL [link=down]": ["OK"]
  "AT+UBTCL": ["+UBTCL:0,C0FFEE001122p", "OK"]
  "AT+UBTBDL": ["+UBTBDL:C0FFEE001144p", "OK"]
  "AT+UBTRSS=*": ["+UBTRSS:-55", "OK"]
  "AT+UBTCST=*": ["+UBTCST:0,247", "OK"]
  "AT+UBTPHYR=*": ["+UBTPHYR:0,2,2", "OK"]
  "AT+UBTM?": ["+UBTM:3", "OK"]
  "AT+UBTLN?": ['+UBTLN:"vucx"', "OK"]
  "AT+UPMPSL?": ["+UPMPSL:0", "OK"]
  "AT+UBTIOC?": ["+UBTIOC:0", "OK"]
  "AT+UBTBSM?": ["+UBTBSM:0", "OK"]
  "AT+UBTPM?": ["+UBTPM:1", "OK"]
  "AT+UBTGPSD=*":
    - "+UBTGPSD:0,1,5,1800"
    - "+UBTGPSD:0,16,32,180D"
    - "+UBTGPSD:0,33,42,7905F431B5CE4E99A40F4B1E122D00D0"
    - "OK"
  "AT+UBTGPSDU=*": ["+UBTGPSDU:0,16,32", "OK"]
  # ANCS: Notification Source 35, Control Point 38, Data Source 40
  "AT+UBTGSCD=0,33,42":
    - "+UBTGSCD:0,34,10,35,9FBF120D630142D98C5825E699A21DBD"
    - "+UBTGSCD:0,37,08,38,69D1D8F345E149A898219BBDFDAAD9D9"
    - "+UBTGSCD:0,39,10,40,22EAC6E924D64BB5BE44B36ACE7C7BFB"
    - "OK"
  "AT+UBTGSCD=*":
    - "+UBTGSCD:0,17,10,18,2A37"
    - "+UBTGSCD:0,20,02,21,2A38"
    - "OK"
  "AT+UBTGCDD=*": ["+UBTGCDD:0,18,19,2902", "OK"]
  "AT+UBTGR=*": ["+UBTGR:0,18,0048", "OK"]
  "AT+UBTGRU=*": ["+UBTGRU:0,18,0048", "OK"]
  "AT+USYLA=*": ["+USYLA:C0FFEE001144", "OK"]
  "AT+USYTU?": ["+USYTU:0000000065000000", "OK"]
  "AT+USYEC?": ["+USYEC:0", "OK"]
  "AT+USYUS?": ["+USYUS:115200,1", "OK"]
  "AT+CSGT?": ['+CSGT:1,"+STARTUP"', "OK"]
  "AT+UMQPB=*": ["+UMQPB:0,1", "OK"]
  "AT+UMQRB=*": [["+UMQRB:0,\"home/garage/cmd\"\x01open", "OK"], ["ERROR"]]
  # HTTP: the probe is redirected to the login page until its form is posted
  "AT+UHTCGH=* [page=probe portal=open]": ['+UHTCGH:0,0,"HTTP/1.1 204 No Content\r\n\r\n"', "OK"]
  "AT+UHTCGH=* [page=probe]":
    - '+UHTCGH:0,0,"HTTP/1.1 302 Found\r\nLocation: http://portal.vucx/login?src=probe\r\n\r\n"'
    - "OK"
  "AT+UHTCGH=* [page=login]":
    - '+UHTCGH:0,0,"HTTP/1.1 200 OK\r\nSet-Cookie: s=vucx; Path=/\r\n\r\n"'
    - "OK"
  "AT+UHTCGH=*": ['+UHTCGH:0,0,"HTTP/1.1 200 OK\r\nContent-Type: text/html\r\n\r\n"', "OK"]
  "AT+UHTCGBB=* [page=probe]": ["ERROR"]
  "AT+UHTCGBB=* [page=login]":
    - "+UHTCGBB:0,0\x01<html><form method='post' action='/login'><input type='hidden' name='token' value='t1'>\
      <input name='room'><input name='surname'><input type='checkbox' name='accept' value='yes'></form></html>"
    - "OK"
  # AssistNow: Thingstream registration, then one UBX-MGA-INI-TIME_UTC frame as the assistance data
  "AT+UHTCGBB=* [page=ztp]":
    - "+UHTCGBB:0,0\x01{\"chipcode\":\"VUCXdemoChipcode=\",\"allowedData\":[\"ulorb_l1\",\"ukion\",\"usvht\"]}"
    - "OK"
  "AT+UHTCGBB=* [page=assistnow]":
    - "+UHTCGBB:0,0\x01\xB5\x62\x13\x40\x18\x00\x10\x00\x00\x80\xEA\x07\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\xEE\x34"
    - "OK"
  "AT+UHTCGBB=* [page=locate]":
    - "+UHTCGBB:0,0\x01{\"location\":{\"lat\":55.61276,\"lng\":12.98625,\"accuracy\":25}}"
    - "OK"
  "AT+UHTCGBB=*": ["+UHTCGBB:0,0\x01<html>vucx</html>", "OK"]
  "AT+UHTCRPOB=*": ["+UHTCRPOB:0,64", "OK"]
  "AT+UNTE?": ["+UNTE:1", "OK"]
  "AT+UNTSC?": ['+UNTSC:0,"pool.ntp.org",162.159.200.1,1', "OK"]
  "AT+UBTA?": ["+UBTA:1,0,[]", "OK"]
  "AT+UBTADL?": ["+UBTADL:0B16F6FF000F001234567800,0", "OK"]
  "AT+UBTALS?": ["+UBTALS:160,240", "OK"]
  # mDNS: enabled, named vucx.local, one HTTP service with a TXT record
  "AT+UMDE?": ["+UMDE:1", "OK"]
  "AT+UMDHN?": ['+UMDHN:"vucx"', "OK"]
  "AT+UMDSA=*": ["+UMDSA:0", "OK"]
  "AT+UMDSL?": ['+UMDSL:0,"_http",0,80,"vucx dashboard"', "OK"]
  "AT+UMDTRL=*": ['+UMDTRL:0,"path","/"', "OK"]
# the network: an NTRIP caster on 2101, a CoAP server on 5683, SNTP on 123, TFTP on 69, HTTP on 80, the ft file
# server on 6970, everything else echoes; a TCP client connects to a listener on an accept port, a UDP client sends
# one datagram to a bound one
sockets:
  servers: {2101: ntrip, 5683: coap, 123: ntp, 69: tftp, 80: http, 6970: ft}
  accept: [8000, 4433]
# the BLE peer (C0FFEE001122) also has every service the gatt.client.* and hid.client examples look for
peer:
  start: 100
  services:
    - uuid: "1805"
      chars: [["2A2B", R N, "EA070A1B0C2313020000"]]
    - uuid: "181A"
      chars: [["2A6E", R N, "2909"], ["2A6F", R N, "9411"]]
    - uuid: "1819"
      chars: [["2A6A", R, "04000000"], ["2A67", N]]
    - uuid: "1815"
      chars: [["2A56", R N, "01"], ["2A58", R, "F401"]]
    - uuid: "180F"
      chars: [["2A19", R N, "5A"]]
    - uuid: "180A"
      chars: [["2A29", R, "text:u-blox"], ["2A24", R, "text:vucx"], ["2A26", R, "text:3.5.0"],
              ["2A23", R, "0011223344556677"]]
    - uuid: "185B"
      chars: [["2C14", R, "0F000000"], ["2C18", R N, "0100"]]
    - uuid: "6E400001B5A3F393E0A9E50E24DCCA9E"
      chars: [["6E400002B5A3F393E0A9E50E24DCCA9E", W w], ["6E400003B5A3F393E0A9E50E24DCCA9E", N]]
    - uuid: "2456E1B926E28F83E744F34F01E9D701"
      chars: [["2456E1B926E28F83E744F34F03E9D701", W w N], ["2456E1B926E28F83E744F34F04E9D701", W w N]]
    - uuid: "14387800130C49E7B8772881C89CB258"
      chars: [["14387801130C49E7B8772881C89CB258", R, "text:vucx-wps 1.0"],
              ["14387802130C49E7B8772881C89CB258", W], ["14387803130C49E7B8772881C89CB258", N]]
    - uuid: "FFE5"
      chars: [["FFE4", N], ["FFE9", W w]]
    - uuid: "1812"
      chars: [["2A4A", R, "11010002"],
              ["2A4B", R, "05010906A1018501050719E029E71500250175019508810295017508810195067508150025650507190029658100C0"],
              ["2A4E", R w, "01"], ["2A4D", R N, "0000000000000000", {"2908": "0101"}], ["2A4C", w]]
    # the ft file server (ft.on on the other module): writes to CTRL/DATA are answered by FtServer
    - uuid: "7A3F00015C1E4D2B9F6A3E8B2C4D5E6F"
      chars: [["7A3F00025C1E4D2B9F6A3E8B2C4D5E6F", W w N], ["7A3F00035C1E4D2B9F6A3E8B2C4D5E6F", w N]]
urcs:
  "AT+UBTC=* [iocap=yesno]": ["+UEBTC:0,C0FFEE001122p", "+UEBTUC:C0FFEE001122p,123456"]
  "AT+UBTC=*": ["+UEBTC:0,C0FFEE001122p"]
  "AT+UBTDC=*": ["+UEBTDC:0"]
  "AT+UBTUC=*,1": ["+UEBTB:C0FFEE001122p,0"]
  "AT+UBTB=*": ["+UEBTB:C0FFEE001122p,0"]
  "AT+UBTCSP=0,1 [cs=initiator]":
    ["+UEBTCSS:0,2,0", "+UEBTCSM:0,4980", "+UEBTCSM:0,5030", "+UEBTCSM:0,4995", "+UEBTCSM:0,5010"]
  # ANCS: one notification on the phone (uid 42), its attributes, then the generic write answer
  "AT+UBTGCCW=0,36,1": ["+UEBTGCN:0,35,001C04012A000000"]
  "AT+UBTGW=0,38,002A000000*":
    - "+UEBTGCN:0,40,002A000000000C00636F6D2E7768617473617070010400416E6E61020000030C0044696E6E657220617420383F\
      050F003230323631303237543139303030300605005265706C79070500436C656172"
  # Wi-Fi provisioning: any command on the control point (159) is answered on the data point (161)
  "AT+UBTGW=0,159,*": ["+UEBTGCN:0,161,5354415455533A434F4E4E45435445443A767563782D6E65743A3139322E3136382E312E3530"]
  # ... and a phone provisions our own Wi-Fi Provisioning server: SET_CONFIG:vucx-net:secret123:WPA2 as text on the
  # control point, then as u-connectXplorer does it (Nordic protobuf): GET_STATUS, START_SCAN, SET_CONFIG ... WPA2
  "AT+UBTGC=14387803130C49E7B8772881C89CB258*":
    - "+UEBTGCW:0,{h:14387802},5345545F434F4E4649473A767563782D6E65743A7365637265743132333A57504132,0"
    - "+UEBTGCW:0,{h:14387802},0801,0"
    - "+UEBTGCW:0,{h:14387802},0802,0"
    - "+UEBTGCW:0,{h:14387802},08045A210A140A08767563782D6E65741206FFFFFFFFFFFF28041209736563726574313233,0"
  "AT+UBTGW=*": ["+UEBTGCN:0,18,0048"]
  "AT+UWAPA*": ["+UEWAPU", "+UEWAPNU"]
  "AT+UWAPD*": ["+UEWAPD"]
  "AT+UMQC=*": ["+UEMQC:0"]
  "AT+UMQS=*": ["+UEMQSC:0,0", "+UEMQDA:0,4"]
  "AT+UMQDC=*": ["+UEMQDC:0,0"]
  "AT+UMDE=1": ["+UEMDU"]
  "AT+UMDE=0": ["+UEMDD"]
  "AT+UDGP=*": ["+UEDGP:1,32,12", "+UEDGPC:4,4,12,10,14"]
  "AT+UHTCRG=*": ['+UEHTCRS:0,200,"OK"']
  "AT+UHTCRPOB=*": ['+UEHTCRS:0,200,"OK"']
  # a host connects and, for the service being activated, enables the HID keyboard report or writes a phone
  # notification to the notification service; to the Matter service (ucxmatter) it is a commissioner that opens
  # the transport: BTP handshake request, version 4, ATT MTU 247, window 5
  "AT+UBTGSA":
    - "+UEBTC:0,C0FFEE001122p"
    - "+UEBTGCW:0,{c:2A4D},0100,0"
    - "+UEBTGCW:0,{h:7A3F0011},31377C4D657373616765737C416E6E617C53656520796F752061742035,0"
    - "+UEBTGCW:0,{h:18EE2EF5263D4559959F4F9C429F9D11},656C04000000F70005,0"
