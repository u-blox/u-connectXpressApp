# vucx profile: a cellular modem (u-blox SARA-like) for cell.* commands.
identity:
  manufacturer: u-blox
  model: SARA-R510M8S
  version: 03.15
  serial: "351234567890123"
default: ["OK"]
commands:
  "ATI": ["Manufacturer: u-blox", "Model: SARA-R510M8S", "OK"]
  "AT+CGMI": ["u-blox", "OK"]
  "AT+CGMM": ["SARA-R510M8S", "OK"]
  "AT+CGMR": ["03.15", "OK"]
  "AT+CGSN": ["351234567890123", "OK"]
  "AT+CIMI": ["240011234567890", "OK"]
  "AT+CCID": ["+CCID: 89460112345678901234", "OK"]
  "AT+CPIN?": ["+CPIN: READY", "OK"]
  "AT+CSQ": ["+CSQ: 20,99", "OK"]
  "AT+CESQ": ["+CESQ: 99,99,255,255,20,50", "OK"]
  "AT+CREG?": ["+CREG: 0,1", "OK"]
  "AT+CEREG?": ["+CEREG: 0,1", "OK"]
  "AT+CGREG?": ["+CGREG: 0,1", "OK"]
  "AT+COPS?": ['+COPS: 0,0,"vucx telecom",7', "OK"]
  "AT+COPS=?": ['+COPS: (2,"vucx telecom","vucx","24099",7),(1,"Other net","Other","24001",9),,(0-4),(0-2)', "OK"]
  "AT+CFUN?": ["+CFUN: 1", "OK"]
  "AT+URAT?": ["+URAT: 7,8", "OK"]
  "AT+UMNOPROF?": ["+UMNOPROF: 90", "OK"]
  "AT+CGATT?": ["+CGATT: 1", "OK"]
  "AT+CGACT?": ["+CGACT: 1,1", "OK"]
  "AT+CGDCONT?": ['+CGDCONT: 1,"IP","internet","10.0.0.5",0,0', "OK"]
  "AT+CGPADDR*": ['+CGPADDR: 1,"10.0.0.5"', "OK"]
  "AT+UPING=*": ["OK"]
  "AT+USOCR=*": ["+USOCR: 0", "OK"]
  "AT+USODL=*": ["CONNECT"]
urcs:
  "AT+UPING=*": ['+UUPING: 1,32,"example.com","93.184.216.34",55,20', '+UUPING: 2,32,"example.com","93.184.216.34",55,22',
                 '+UUPING: 3,32,"example.com","93.184.216.34",55,24', '+UUPING: 4,32,"example.com","93.184.216.34",55,26']
