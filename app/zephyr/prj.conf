# u-connectXpressApp on Zephyr: shell on the zephyr,console UART, module on the ucxapp-module alias.

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_U_CONNECT_CLIENT=y

# The command layer runs in the main thread and allocates with malloc (same sizes as the STM32 build).
CONFIG_MAIN_STACK_SIZE=24576
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=163840
CONFIG_PICOLIBC_IO_FLOAT=y

# sys.mem / sys.tasks
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

CONFIG_HW_STACK_PROTECTION=y
