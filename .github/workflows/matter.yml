name: matter

# The Matter plug-in (ucxmatter) on Windows, Linux and in the browser. Started by hand or by release.yml: the
# SDK fetch and build take long, so it does not run on every push. The checkout is minimal: only u-connectClient
# and mbedTLS; the launcher fetches the one SDK commit, only the folders the node needs (matter_fetch in ucxapp.py).

on:
  workflow_dispatch:
  workflow_call:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Init u-connectClient and mbedTLS (not the Matter SDK, the launcher fetches it)
        run: |
          git submodule update --init u-connectClient
          git submodule update --init --recursive third-party/mbedtls
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: GCC (MSYS2 UCRT; the Matter SDK does not build with MSVC)
        run: C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc"
      - name: Build the plug-in (zero warnings)
        shell: bash
        run: |
          set -o pipefail
          python ucxapp.py --matter --build 2>&1 | tee matter-build.log
          ! grep -n "warning:" matter-build.log
      - name: Build the app
        run: |
          cmake -S app -B build/windows -A x64
          cmake --build build/windows --config Release
      - name: Matter tests (stand-in plug-in, real plug-in on the virtual module)
        run: |
          python -m pip install pytest pytest-xdist pyyaml cryptography
          python -m pytest tests/test_matter.py tests/test_matter_plugin.py tests/test_launcher.py -p no:cacheprovider
      - uses: actions/upload-artifact@v5
        with:
          name: matter-windows
          path: app/bin/ucxmatter.dll

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Init u-connectClient and mbedTLS (not the Matter SDK, the launcher fetches it)
        run: |
          git submodule update --init u-connectClient
          git submodule update --init --recursive third-party/mbedtls
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ninja-build g++
      - name: gn key (the commit ucxapp.py builds gn from)
        id: gn
        run: echo "commit=$(sed -n 's/^GN_COMMIT = \"\(.*\)\"/\1/p' ucxapp.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: build/gn
          key: gn-${{ runner.os }}-${{ steps.gn.outputs.commit }}
      - name: Build the plug-in (zero warnings; gn from source the first time)
        run: |
          set -o pipefail
          python ucxapp.py --matter --build 2>&1 | tee matter-build.log
          ! grep -n "warning:" matter-build.log
      - name: Build the app
        run: |
          cmake -S app -B build/linux -DCMAKE_BUILD_TYPE=Release
          cmake --build build/linux --parallel
      - name: Matter tests (stand-in plug-in, real plug-in on the virtual module)
        run: |
          python -m pip install pytest pytest-xdist pyyaml cryptography
          python -m pytest tests/test_matter.py tests/test_matter_plugin.py tests/test_launcher.py -p no:cacheprovider
      - name: Package
        run: |
          mkdir -p pkg/linux
          cp app/bin/libucxmatter.so pkg/linux/
      - uses: actions/upload-artifact@v5
        with:
          name: matter-linux
          path: pkg

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Init u-connectClient and mbedTLS (not the Matter SDK, the launcher fetches it)
        run: |
          git submodule update --init u-connectClient
          git submodule update --init --recursive third-party/mbedtls
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: emscripten-core/setup-emsdk@v16
      - run: sudo apt-get update && sudo apt-get install -y ninja-build g++
      - name: gn key (the commit ucxapp.py builds gn from)
        id: gn
        run: echo "commit=$(sed -n 's/^GN_COMMIT = \"\(.*\)\"/\1/p' ucxapp.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: build/gn
          key: gn-${{ runner.os }}-${{ steps.gn.outputs.commit }}
      - name: Build the site with the node linked in (zero warnings)
        run: |
          set -o pipefail
          python ucxapp.py --wasm --matter --build 2>&1 | tee matter-build.log
          ! grep -n "warning:" matter-build.log
      - name: The node is built in
        run: |
          python -m pip install pytest pyyaml cryptography
          python -m pytest tests/test_wasm.py -k matter -p no:cacheprovider
