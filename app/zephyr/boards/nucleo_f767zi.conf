# CAN controller for can.* (zephyr,canbus: RX PD0, TX PD1).
CONFIG_CAN=y

# HTTPS web UI: keys and tokens from the hardware TRNG (zephyr,entropy), see docs/SECURITY.md.
CONFIG_ENTROPY_GENERATOR=y
# 368 KB main RAM: the web UI's static buffers and thread stacks leave room for a 144 KB malloc arena (TLS, app).
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=147456
