name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Init u-connectClient (not its nested submodules)
        run: |
          git submodule update --init u-connectClient
          git submodule update --init --recursive third-party/mbedtls
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python -m pip install --upgrade pip pytest pytest-cov ruff
      - name: Run pytest (ruff + shellcheck + repo checks)
        shell: bash
        run: python -m pytest -q --cov --cov-report=term-missing --cov-report=xml

  c-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Init u-connectClient (not its nested submodules)
        run: |
          git submodule update --init u-connectClient
          git submodule update --init --recursive third-party/mbedtls
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build instrumented ucxapp
        run: |
          python -m pip install pytest gcovr
          cmake -S app -B build-cov -DUCXAPP_COVERAGE=ON
          cmake --build build-cov
      - name: Run CLI tests and report C coverage
        env:
          UCX_APP_EXE: ${{ github.workspace }}/app/bin/ucxapp
        run: |
          python -m pytest tests/test_cli.py -q
          gcovr -r . --filter 'app/src/' --object-directory build-cov --txt --xml coverage-c.xml
      - uses: actions/upload-artifact@v5
        with:
          name: c-coverage
          path: coverage-c.xml

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Init u-connectClient (not its nested submodules)
        run: |
          git submodule update --init u-connectClient
          git submodule update --init --recursive third-party/mbedtls
      - name: Configure
        run: cmake -S app -B build/windows -A x64
      - name: Build
        run: cmake --build build/windows --config Release
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Smoke tests (drives the exe through a pseudo console, no hardware)
        run: |
          python -m pip install pytest pywinpty
          python -m pytest tests/test_app_smoke.py -q
      - uses: actions/upload-artifact@v5
        with:
          name: ucxapp-windows
          path: app/bin/ucxapp.exe
