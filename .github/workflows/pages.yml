name: pages

# u-connectXpressApp in the browser (WebAssembly + Web Serial) on GitHub Pages.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Init u-connectClient and mbedTLS (not the Matter SDK, the launcher fetches it)
        run: |
          git submodule update --init u-connectClient
          git submodule update --init --recursive third-party/mbedtls
      - uses: emscripten-core/setup-emsdk@v16
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ninja-build g++
      - name: gn key (the commit ucxapp.py builds gn from)
        id: gn
        run: echo "commit=$(sed -n 's/^GN_COMMIT = \"\(.*\)\"/\1/p' ucxapp.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: build/gn
          key: gn-${{ runner.os }}-${{ steps.gn.outputs.commit }}
      - name: Build the browser app with the Matter node
        run: |
          python ucxapp.py --wasm --build
          grep -qa "Matter SDK " build/wasm/site/ucxapp.wasm
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/wasm/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
