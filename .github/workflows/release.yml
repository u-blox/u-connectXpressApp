name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Init u-connectClient (not its nested submodules)
        run: |
          git submodule update --init u-connectClient
          git submodule update --init --recursive third-party/mbedtls
      - run: cmake -S app -B build/windows -A x64
      - run: cmake --build build/windows --config Release   # build check only; release.py ships the locally signed exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Init u-connectClient (not its nested submodules)
        run: |
          git submodule update --init u-connectClient
          git submodule update --init --recursive third-party/mbedtls
      - run: cmake -S app -B build/linux -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/linux
      - name: Package
        run: |
          mkdir -p pkg/linux
          cp app/bin/ucxapp pkg/linux/
          (cd pkg/linux && sha256sum ucxapp > ucxapp.sha256)
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: pkg

  stm32:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: nucleo_h753zi
            repo: STM32CubeH7
            ref: v1.12.1   # master no longer has FreeRTOS/Source/CMSIS_RTOS
          - board: nucleo_f767zi
            repo: STM32CubeF7
            ref: master
          - board: nucleo_f439zi
            repo: STM32CubeF4
            ref: master
          - board: f407_disc
            repo: STM32CubeF4
            ref: master
          - board: nucleo_f401re
            repo: STM32CubeF4
            ref: master
          - board: nucleo_f446re
            repo: STM32CubeF4
            ref: master
          - board: nucleo_f103rb
            repo: STM32CubeF1
            ref: master
          - board: nucleo_g071rb
            repo: STM32CubeG0
            ref: master
    steps:
      - uses: actions/checkout@v5
      - name: Init u-connectClient (not its nested submodules)
        run: |
          git submodule update --init u-connectClient
          git submodule update --init --recursive third-party/mbedtls
          git submodule update --init third-party/littlefs
      - name: Install toolchain
        # Same Arm GNU release as local builds; Ubuntu's older gcc overflows the 128 KB lite boards.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          curl -fsSL https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi/bin" >> "$GITHUB_PATH"
      - name: Fetch STM32Cube HAL
        run: git clone --depth 1 --branch ${{ matrix.ref }} --recurse-submodules --shallow-submodules https://github.com/STMicroelectronics/${{ matrix.repo }} "$RUNNER_TEMP/hal"
      - name: Build
        run: |
          cmake -G Ninja -S app/stm32_freertos -B build/stm32 \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/u-connectClient/cmake/arm-none-eabi-gcc.cmake \
            -DSTM32_BOARD=${{ matrix.board }} -DSTM32_HAL_PATH="$RUNNER_TEMP/hal" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/stm32
      - name: Package
        run: |
          short=$(echo "${{ matrix.board }}" | sed -E 's/^(nucleo_)?([a-z][0-9]+).*/\2/')
          d=pkg/stm32/stm32_$short
          mkdir -p $d
          cp build/bin/ucxapp_${{ matrix.board }}.{bin,hex,elf} $d/
          (cd $d && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v5
        with:
          name: stm32-${{ matrix.board }}
          path: pkg

  # One tree for release.py: linux/ and stm32/stm32_<board>/; it adds the signed windows/ and publishes.
  bundle:
    needs: [windows, linux, stm32]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: tree
          pattern: "{linux,stm32-*}"
          merge-multiple: true
      - uses: actions/upload-artifact@v5
        with:
          name: release-tree
          path: tree
