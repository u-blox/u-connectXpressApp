# 128 KB RAM (plus 64 KB CCM that DMA cannot reach); the arena leaves room for the trigger.* thread's 12 KB stack.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=30720

# CAN controller for can.* (zephyr,canbus, pins in the overlay).
CONFIG_CAN=y
# hw.* on the board's pins (user button and LED)
CONFIG_GPIO=y
