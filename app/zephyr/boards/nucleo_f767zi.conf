# CAN controller for can.* (zephyr,canbus: RX PD0, TX PD1).
CONFIG_CAN=y

# HTTPS web UI: keys and tokens from the hardware TRNG (zephyr,entropy), see docs/SECURITY.md.
CONFIG_ENTROPY_GENERATOR=y
# 368 KB main RAM: the web UI's static buffers and the web and trigger.* thread stacks leave room for a 128 KB
# malloc arena (TLS, app).
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=131072
# hw.* on the board's pins (user button and LED)
CONFIG_GPIO=y
