name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Init u-connectClient (not its nested submodules)
        run: |
          git submodule update --init u-connectClient
          git submodule update --init --recursive third-party/mbedtls
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python -m pip install --upgrade pip pytest pytest-cov ruff html5validator cryptography
      - name: Run pytest (ruff + shellcheck + repo checks, W3C vnu + node --check of the web page)
        shell: bash
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

  c-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Init u-connectClient (not its nested submodules)
        run: |
          git submodule update --init u-connectClient
          git submodule update --init --recursive third-party/mbedtls
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build instrumented ucxapp
        run: |
          python -m pip install pytest gcovr cryptography
          cmake -S app -B build-cov -DUCXAPP_COVERAGE=ON
          cmake --build build-cov
      - name: Run CLI tests and report C coverage
        env:
          UCX_APP_EXE: ${{ github.workspace }}/app/bin/ucxapp
        run: |
          python -m pytest tests/test_cli.py tests/test_certfile.py
          gcovr -r . --filter 'app/src/' --object-directory build-cov --txt --xml coverage-c.xml
      - uses: actions/upload-artifact@v5
        with:
          name: c-coverage
          path: coverage-c.xml

  build-zephyr:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [h753, f767, f439, f407, f401, f446, f103]
    env:
      ZEPHYR_REF: v4.5.0
    steps:
      - uses: actions/checkout@v5
      - name: Init u-connectClient (not its nested submodules)
        run: git submodule update --init u-connectClient
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cache Zephyr workspace and SDK
        uses: actions/cache@v5
        with:
          path: |
            ~/zephyrproject
            ~/zephyr-sdk-*
          key: zephyr-${{ env.ZEPHYR_REF }}-stm32
      - name: Set up Zephyr (stm32 HAL and CMSIS only, arm toolchain only)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build device-tree-compiler
          python -m pip install west
          if [ ! -d ~/zephyrproject/.west ]; then
            west init -m https://github.com/zephyrproject-rtos/zephyr --mr "$ZEPHYR_REF" ~/zephyrproject
          fi
          cd ~/zephyrproject || exit 1
          west config manifest.project-filter -- '-.*,+hal_stm32,+cmsis,+cmsis_6'
          west update --narrow -o=--depth=1
          python -m pip install -r zephyr/scripts/requirements-base.txt
          cd zephyr || exit 1
          ls -d ~/zephyr-sdk-* >/dev/null 2>&1 || west sdk install -t arm-zephyr-eabi
      - name: Build ${{ matrix.board }} (warnings are errors)
        shell: bash
        env:
          BOARD: ${{ matrix.board }}
        run: |
          python ucxapp.py --stm32-zephyr --board "$BOARD" --build 2>&1 | tee zephyr-build.txt
          test "${PIPESTATUS[0]}" -eq 0 || exit 1
          if grep -E "warning:" zephyr-build.txt; then exit 1; fi
      - uses: actions/upload-artifact@v5
        with:
          name: ucxapp-zephyr-${{ matrix.board }}
          path: build/zephyr_${{ matrix.board }}/zephyr/zephyr.bin

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Init u-connectClient (not its nested submodules)
        run: |
          git submodule update --init u-connectClient
          git submodule update --init --recursive third-party/mbedtls
      - uses: emscripten-core/setup-emsdk@v16
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the browser app (warnings are errors)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          emcmake cmake -S app -B build/wasm -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/wasm 2>&1 | tee wasm-build.txt
          test "${PIPESTATUS[0]}" -eq 0 || exit 1
          if grep -E "warning:" wasm-build.txt; then exit 1; fi
      - name: Run it in Chromium (fake and virtual Web Serial), W3C check of the site page
        run: |
          python -m pip install pytest playwright html5validator
          python -m playwright install --with-deps chromium
          python -m pytest tests/test_wasm.py "tests/test_webpage.py::test_page_passes_the_w3c_validator[wasm-site]"
      - uses: actions/upload-artifact@v5
        with:
          name: ucxapp-wasm
          path: build/wasm/site

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Init u-connectClient (not its nested submodules)
        run: |
          git submodule update --init u-connectClient
          git submodule update --init --recursive third-party/mbedtls
      - name: Configure
        run: cmake -S app -B build/windows -A x64
      - name: Build
        run: cmake --build build/windows --config Release
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Smoke tests (drives the exe through a pseudo console, no hardware)
        run: |
          python -m pip install pytest pywinpty
          python -m pytest tests/test_app_smoke.py
      - uses: actions/upload-artifact@v5
        with:
          name: ucxapp-windows
          path: app/bin/ucxapp.exe
