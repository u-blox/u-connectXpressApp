# Lite build (36 KB RAM, 128 KB flash): Wi-Fi and Bluetooth/GATT only, see CMakeLists.txt.
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=12288
CONFIG_IDLE_STACK_SIZE=256
CONFIG_ISR_STACK_SIZE=1024
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_PICOLIBC_IO_FLOAT=n
CONFIG_HW_STACK_PROTECTION=n
# No sys.tasks stack usage or heap statistics: they do not fit in 128 KB flash.
CONFIG_SYS_HEAP_RUNTIME_STATS=n
CONFIG_THREAD_MONITOR=n
CONFIG_THREAD_NAME=n
CONFIG_THREAD_STACK_INFO=n
CONFIG_INIT_STACKS=n
# No boot banner or printk (the app writes to the console UART itself).
CONFIG_BOOT_BANNER=n
CONFIG_PRINTK=n
